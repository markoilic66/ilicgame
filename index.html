<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ilicgame</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Ilicgame</h1>

      <section class="stats" aria-label="Game stats">
        <div class="stat-card">
          <span class="label">Move</span>
          <strong id="moveNumber">0</strong>
        </div>
        <div class="stat-card">
          <span class="label">Latest Gain</span>
          <strong id="latestGain">0</strong>
        </div>
        <div class="stat-card">
          <span class="label">Total Score</span>
          <strong id="totalScore">0</strong>
        </div>
        <div class="stat-card">
          <span class="label">Best Score</span>
          <strong id="bestScore">0</strong>
        </div>
      </section>

      <section class="controls" aria-label="Game controls">
        <button id="undoBtn" type="button">Undo</button>
        <button id="restartBtn" type="button">Restart</button>
      </section>

      <section class="board-wrap" aria-label="Game board">
        <div id="board" class="board" role="grid" aria-label="Ilicgame board"></div>
      </section>
    </main>

    <script type="module" src="ui.js"></script>
  </body>
</html>
